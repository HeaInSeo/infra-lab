name: Notion projection guard

on:
  pull_request:
    paths:
      - 'ops/notion-projection-guard/**'
      - '.github/workflows/notion-projection-guard.yml'
  push:
    paths:
      - 'ops/notion-projection-guard/**'
      - '.github/workflows/notion-projection-guard.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test ops/notion-projection-guard/test_guard.cjs ops/notion-projection-guard/test_runtime.cjs
